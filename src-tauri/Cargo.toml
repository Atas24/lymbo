[package]
name = "lymbo"
version = "2.0.0"
description = "Lymbo - assisted job search desktop app"
edition = "2021"

[lib]
name = "lymbo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compiled into the app, so users don't need it installed.
rusqlite = { version = "0.32", features = ["bundled"] }
# macOS Keychain / Windows Credential Manager for the API key.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
headless_chrome = { version = "1.0.22", default-features = false }
pdf-extract = "0.12.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
